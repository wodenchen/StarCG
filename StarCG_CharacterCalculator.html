<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色能力計算器 - 星詠魔力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #f3efe9; --bg-card: #faf8f5; --border: #ddd5c8;
      --text-primary: #443c34; --text-secondary: #7a7268;
      --accent: #8b7355; --accent-soft: #ebe6de; --accent-gold: #b8956a;
      --accent-green: #6a9468; --accent-red: #b86868; --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 16px; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: clamp(1.2rem, 4vw, 1.6rem); color: #6b5a45; }
    .header-nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; }
    .header-nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
    .header-nav a:hover { color: var(--text-primary); text-decoration: underline; }
    .grid { display: grid; gap: 16px; grid-template-columns: 380px 1fr; }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 2px 10px rgba(68,60,52,.06); }
    .card h2 { font-size: 1rem; margin-bottom: 12px; color: #6b5a45; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .hint { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; }
    .status { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .status-item { background: var(--accent-soft); border-radius: 8px; padding: 10px; text-align: center; }
    .status-item .k { font-size: 0.78rem; color: var(--text-secondary); }
    .status-item .v { font-size: 1.25rem; font-weight: 700; }
    .field-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
    .field label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; }
    .field-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
    .field-head label { margin-bottom: 0; }
    .stat-shortcuts { display: flex; gap: 4px; flex-shrink: 0; }
    .stat-shortcut-btn {
      padding: 2px 7px; font-size: 0.72rem; border: 1px solid var(--border); border-radius: 6px;
      background: var(--accent-soft); color: var(--accent); cursor: pointer; font-weight: 700; line-height: 1.4;
    }
    .stat-shortcut-btn:hover { background: var(--accent); color: #fff; }
    .stat-clear-all { margin-bottom: 10px; }
    .stat-clear-all .stat-shortcut-btn { padding: 4px 12px; font-size: 0.78rem; }
    .equip-extra-options {
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 4px;
      font-size: 0.85rem;
    }
    .equip-extra-options label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary); }
    .equip-extra-options input { accent-color: var(--accent); }
    .equip-extra-options .stat-shortcut-btn { padding: 4px 12px; font-size: 0.78rem; }
    .slot-cluster { display: flex; align-items: center; gap: 6px; width: max-content; max-width: 46%; }
    .cluster-top { flex-direction: column; align-items: center; }
    .cluster-left { flex-direction: row; }
    .cluster-right { flex-direction: row; }
    .cluster-bottom { flex-direction: column; align-items: center; }
    .decor-col { display: flex; gap: 5px; flex-shrink: 0; }
    .cluster-top .decor-col, .cluster-bottom .decor-col { flex-direction: row; }
    .cluster-left .decor-col, .cluster-right .decor-col { flex-direction: column; }
    .decor-btn {
      min-width: 36px; min-height: 36px; padding: 3px; border: 1px solid #c4b8a8; border-radius: 8px;
      background: #fffaf2; cursor: pointer; text-align: center; font-size: 0.85rem; line-height: 1;
      color: #6b5a45; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .decor-btn:hover { background: #f0e4d4; border-color: var(--accent); }
    .decor-btn.empty { color: var(--text-secondary); font-size: 1rem; flex-direction: row; }
    .decor-btn.has-img { min-width: 50px; max-width: 56px; padding: 3px 2px; }
    .decor-btn .decor-thumb {
      width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; display: block; flex-shrink: 0;
    }
    .decor-btn .decor-label {
      font-size: 0.48rem; font-weight: 700; line-height: 1.1; max-width: 52px;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .picker-item .decor-icon { font-size: 1.1rem; line-height: 28px; }
    .equip-mode-rows { margin-top: 10px; }
    .equip-mode-rows .stat-mode-row:last-child { margin-bottom: 0; }
    .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 1rem; }
    .stat-mode-row { margin-bottom: 6px; }
    .custom-stat-panel {
      margin-top: auto; padding: 10px; border: 1px dashed var(--border); border-radius: 8px;
      background: #fff; max-height: min(42vh, 360px); overflow-y: auto;
    }
    .custom-stat-panel.hidden { display: none; }
    .custom-slot-block + .custom-slot-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .custom-slot-label { font-size: 0.82rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .custom-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
    .custom-stat-grid label { font-size: 0.75rem; color: var(--text-secondary); display: block; }
    .custom-stat-grid input { width: 100%; margin-top: 2px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    .equip-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
    @media (max-width: 768px) { .equip-layout { grid-template-columns: 1fr; } }
    .results-column { display: flex; flex-direction: column; min-height: 100%; }
    .equip-stage {
      position: relative; height: 430px; border: 1px solid var(--border); border-radius: 12px;
      background: radial-gradient(closest-side, #f5e8da 40%, #faf4ec 100%);
      overflow: hidden;
    }
    .equip-stage .slot { position: absolute; width: max-content; max-width: 44%; z-index: 1; }
    .equip-stage .slot-cluster { z-index: 2; }
    .slot.tl { left: 3%; top: 10%; }
    .slot.tc { left: 50%; top: 1%; transform: translateX(-50%); }
    .slot.tr { right: 3%; top: 10%; }
    .slot.ml { left: 12%; top: 48%; transform: translateY(-50%); }
    .slot.mr { right: 12%; top: 48%; transform: translateY(-50%); }
    .slot.bl { left: 14%; bottom: 2%; }
    .slot.br { right: 14%; bottom: 2%; }
    .equip-btn {
      width: 96px; min-width: 96px; max-width: 96px; flex-shrink: 0;
      padding: 10px 8px; border: 1px solid var(--border); border-radius: 10px;
      background: #fff; cursor: pointer; text-align: center; font-size: 0.82rem; line-height: 1.35;
      color: var(--text-primary);
    }
    .equip-btn:hover { background: var(--accent-soft); }
    .equip-btn .slot-label { display: block; font-weight: 700; color: var(--text-secondary); font-size: 0.75rem; }
    .equip-btn .item-name { display: block; font-weight: 700; color: var(--text-primary); margin-top: 2px; }
    .equip-btn .item-name.empty { color: var(--text-secondary); font-weight: 500; }
    .equip-btn .equip-thumb { width: 28px; height: 28px; object-fit: contain; image-rendering: pixelated; display: block; margin: 0 auto 4px; }
    .result-block { background: var(--accent-soft); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .result-block h3 { font-size: 0.92rem; margin-bottom: 8px; }
    .result-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 0.92rem; }
    .result-list.mod { grid-template-columns: repeat(3, 1fr); }
    .result-item { display: flex; justify-content: space-between; gap: 8px; }
    .load-bar { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 14px; font-size: 0.9rem; color: var(--text-secondary); }
    .load-bar.ok { background: #f2f6f2; border-color: #c4d4c4; color: #4a684a; }
    .load-bar.err { background: #f8f4f0; border-color: #d4c8b8; color: #6b5a45; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal.hidden { display: none; }
    .modal-card { width: min(720px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .modal-card.picker-dialog { width: min(920px, 100%); }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .modal-body { padding: 12px 16px; overflow: auto; flex: 1; }
    .modal-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .picker-hint { margin-bottom: 6px; }
    .picker-stat-preview,
    .equip-stat-preview {
      min-height: 2.5em; padding: 8px 10px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 8px; background: #fff;
      font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5;
    }
    .picker-stat-preview.active,
    .equip-stat-preview.active { color: var(--text-primary); }
    .picker-stat-preview .name,
    .equip-stat-preview .name { font-weight: 700; color: var(--text-primary); margin-right: 8px; }
    .picker-layout { display: flex; gap: 12px; min-height: 340px; }
    .picker-sub-tabs {
      display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; min-width: 88px;
      border-right: 1px solid var(--border); padding-right: 10px; max-height: 52vh; overflow-y: auto;
    }
    .picker-sub-tab {
      padding: 8px 12px; cursor: pointer; border-radius: 6px; color: var(--text-secondary);
      font-weight: 600; font-size: 0.88rem; white-space: nowrap; text-align: left; border: none; background: transparent;
    }
    .picker-sub-tab:hover { background: var(--accent-soft); color: var(--text-primary); }
    .picker-sub-tab.active { background: var(--accent-gold); color: #fff; }
    .picker-grid-wrap { flex: 1; min-width: 0; overflow-y: auto; max-height: 52vh; }
    .picker-cat-title {
      font-weight: 700; color: var(--text-primary); margin: 0 0 8px; padding-bottom: 4px;
      border-bottom: 1px dashed var(--border); font-size: 0.9rem;
    }
    .picker-stat-group-title {
      font-size: 0.82rem; font-weight: 700; color: var(--text-secondary);
      margin: 12px 0 6px; padding-left: 2px;
    }
    .picker-stat-group-title:first-child { margin-top: 0; }
    .picker-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .picker-item {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      width: 86px; min-height: 96px; padding: 8px 4px 6px; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; text-align: center; transition: all 0.15s;
      color: var(--text-primary); font-weight: 500;
    }
    .picker-item:hover { border-color: var(--accent-gold); background: #fff8ee; color: var(--text-primary); }
    .picker-icon { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; margin-bottom: 4px; }
    .picker-icon.placeholder { display: block; background: var(--accent-soft); border-radius: 4px; }
    .picker-item .lv { font-size: 0.68rem; color: var(--text-secondary); margin-bottom: 2px; font-weight: 700; }
    .picker-item .lv.soul-tag { color: #fff; padding: 1px 7px; border-radius: 8px; display: inline-block; }
    .soul-blue { background: #2980b9; }
    .soul-red { background: #c0392b; }
    .soul-yellow { background: #e69b00; }
    .equip-btn .soul-tag {
      display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 8px;
      font-size: 0.72rem; color: #fff; vertical-align: middle;
    }
    .picker-item .name { font-size: 0.78rem; line-height: 1.3; font-weight: 700; color: var(--text-primary); word-break: break-all; }
    @media (max-width: 640px) {
      .picker-layout { flex-direction: column; }
      .picker-sub-tabs { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding-right: 0; padding-bottom: 8px; max-height: none; }
    }
    button { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    button.secondary { background: #fff; color: var(--text-primary); border-color: var(--border); }
    table.compare { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
    table.compare th, table.compare td { border-bottom: 1px solid var(--border); padding: 8px; text-align: center; }
    table.compare th { background: var(--accent-soft); }
    .compare-wrap { overflow-x: auto; margin-top: 10px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚔️ 角色能力計算器</h1>
    <nav class="header-nav" aria-label="相關連結">
      <a href="StarCG_PriceChecker.html">⭐ 市場查價器</a>
      <a href="StarCG_PetCalculator.html">🐾 寵物成長模擬</a>
      <a href="https://www.starcg.net/" target="_blank" rel="noopener noreferrer">🌐 官網</a>
      <a href="https://guide.starcg.net/" target="_blank" rel="noopener noreferrer">📖 官方攻略網</a>
    </nav>
  </header>

  <div id="loadBar" class="load-bar">⏳ 載入裝備圖鑑…</div>
  <input type="file" id="equipFileInput" accept=".json,application/json" hidden>

  <div class="grid">
    <section class="card">
      <h2>參數設定</h2>
      <p class="hint">單項上限為可配點數的一半。</p>
      <div class="status">
        <div class="status-item"><div class="k">可配點數</div><div class="v" id="pointsAvail">0</div></div>
        <div class="status-item"><div class="k">已配點數</div><div class="v" id="pointsUsed">0</div></div>
        <div class="status-item"><div class="k">剩餘</div><div class="v" id="pointsRemain">0</div></div>
        <div class="status-item"><div class="k">單項最高</div><div class="v" id="singleMax">0</div></div>
      </div>
      <div class="stat-clear-all">
        <button type="button" class="stat-shortcut-btn" id="clearAllStatsBtn">清空全配點</button>
      </div>
      <div class="field-row">
        <div class="field"><label>預測等級</label><input type="number" id="level" value="120" min="1" max="200"></div>
      </div>
      <div class="field-row">
        <div class="field"><div class="field-head"><label for="vit">體力</label><div class="stat-shortcuts"><button type="button" class="stat-shortcut-btn" data-stat="vit" data-mode="100">100</button><button type="button" class="stat-shortcut-btn" data-stat="vit" data-mode="max">滿</button><button type="button" class="stat-shortcut-btn" data-stat="vit" data-mode="remain">剩餘</button></div></div><input type="number" id="vit" value="0" min="0"></div>
        <div class="field"><div class="field-head"><label for="str">力量</label><div class="stat-shortcuts"><button type="button" class="stat-shortcut-btn" data-stat="str" data-mode="100">100</button><button type="button" class="stat-shortcut-btn" data-stat="str" data-mode="max">滿</button><button type="button" class="stat-shortcut-btn" data-stat="str" data-mode="remain">剩餘</button></div></div><input type="number" id="str" value="0" min="0"></div>
        <div class="field"><div class="field-head"><label for="def">強度</label><div class="stat-shortcuts"><button type="button" class="stat-shortcut-btn" data-stat="def" data-mode="100">100</button><button type="button" class="stat-shortcut-btn" data-stat="def" data-mode="max">滿</button><button type="button" class="stat-shortcut-btn" data-stat="def" data-mode="remain">剩餘</button></div></div><input type="number" id="def" value="0" min="0"></div>
        <div class="field"><div class="field-head"><label for="agi">速度</label><div class="stat-shortcuts"><button type="button" class="stat-shortcut-btn" data-stat="agi" data-mode="100">100</button><button type="button" class="stat-shortcut-btn" data-stat="agi" data-mode="max">滿</button><button type="button" class="stat-shortcut-btn" data-stat="agi" data-mode="remain">剩餘</button></div></div><input type="number" id="agi" value="0" min="0"></div>
        <div class="field"><div class="field-head"><label for="mag">魔法</label><div class="stat-shortcuts"><button type="button" class="stat-shortcut-btn" data-stat="mag" data-mode="100">100</button><button type="button" class="stat-shortcut-btn" data-stat="mag" data-mode="max">滿</button><button type="button" class="stat-shortcut-btn" data-stat="mag" data-mode="remain">剩餘</button></div></div><input type="number" id="mag" value="0" min="0"></div>
      </div>
    </section>

    <section class="card">
      <div class="equip-layout">
        <div>
          <h2>裝備模擬</h2>
          <p class="hint">點擊欄位從圖鑑選裝備，能力自動帶入。</p>
          <div class="equip-stage" id="equipStage"></div>
          <div class="equip-mode-rows">
            <div class="field-row stat-mode-row">
              <div class="field"><label>一般屬性（攻防敏回精）</label><select id="statModeGeneral"></select></div>
              <div class="field"><label>修正／抗性</label><select id="statModeMod"></select></div>
            </div>
            <div class="field-row stat-mode-row">
              <div class="field"><label>寶石</label><select id="globalGemDecor"></select></div>
              <div class="field"><label>附魔石</label><select id="globalEnchantMode"></select></div>
            </div>
            <div class="equip-extra-options">
              <button type="button" class="stat-shortcut-btn" id="clearAllEquipsBtn">清空全裝備</button>
              <label><input type="checkbox" id="hyorikiToggle">百靈耐（玩家製作／水龍系列 攻防敏回精 +5%）</label>
            </div>
          </div>
          <div id="equipStatPreview" class="equip-stat-preview">游標指向已裝備欄位或寶石／附魔石可預覽效果</div>
        </div>
        <div class="results-column">
          <h2>能力結果</h2>
          <div class="result-block">
            <h3>基本值</h3>
            <div class="result-list" id="basicResults"></div>
          </div>
          <div class="result-block">
            <h3>修正與抗值</h3>
            <div class="result-list mod" id="modResults"></div>
          </div>
          <div id="customStatPanel" class="custom-stat-panel hidden"></div>
        </div>
      </div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h2>比較清單</h2>
    <div class="field-row">
      <div class="field"><label>名稱</label><input type="text" id="buildName" placeholder="未命名"></div>
      <div class="field" style="display:flex;align-items:flex-end"><button type="button" id="addBuildBtn">➕ 加入比較清單</button></div>
    </div>
    <div class="compare-wrap">
      <table class="compare" id="compareTable">
        <thead><tr>
          <th>名稱</th><th>Lv</th><th>HP</th><th>MP</th><th>攻</th><th>防</th><th>敏</th><th>精</th><th>回</th><th>魔攻</th><th>抗魔</th><th>必殺</th><th>反擊</th><th>命中</th><th>閃躲</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<div id="pickerModal" class="modal hidden">
  <div class="modal-card picker-dialog">
    <div class="modal-header" id="pickerTitle">選擇裝備</div>
    <div class="modal-body">
      <p class="hint picker-hint" id="pickerHint">游標指向裝備可查看屬性（依「裝備數值」設定）。</p>
      <div id="pickerStatPreview" class="picker-stat-preview">—</div>
      <div class="picker-layout">
        <div id="pickerSubTabs" class="picker-sub-tabs"></div>
        <div id="pickerGrid" class="picker-grid-wrap"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="pickerClearBtn">清除此欄</button>
      <button type="button" class="secondary" id="pickerCloseBtn">關閉</button>
    </div>
  </div>
</div>

<script src="gems_data.js"></script>
<script src="equipment_catalog.js" async id="equipCatalogScript"></script>
<script>
const REPO_RAW = 'https://raw.githubusercontent.com/wodenchen/StarCG/main/';
const GUIDE_EQUIP_URL = 'https://guide.starcg.net/equipment/';
const GUIDE_IMAGE_BASE = 'https://guide.starcg.net';
const CORS_PROXIES = ['https://corsproxy.io/?url=', 'https://api.allorigins.win/raw?url='];

const CATEGORY_LABELS = {
  sword:'劍', axe:'斧', spear:'槍', bow:'弓', staff:'杖', dagger:'小刀', boomerang:'回力鏢',
  helmet:'盔', hat:'帽', armor:'鎧', clothes:'衣', robe:'袍',
  boots:'靴', shoes:'鞋', shield:'盾', ring:'戒指', necklace:'項鍊', earring:'耳環',
  bracelet:'手環', amulet:'護身符', headband:'頭帶', fudan:'弗旦', 'water-dragon':'水龍',

function gd() { return window.GEMS_DATA; }

function canGemSlot(slotId) {
  return gd().GEM_SLOT_IDS.includes(slotId);
}

function getValidEnchants(slotId) {
  return Object.entries(gd().ENCHANT_SLOT_RULES)
    .filter(([, slots]) => slots.includes(slotId))
    .map(([k]) => k);
}

function getGemRatio(decor) {
  if (decor.gemApply === 'craft') return 1;
  return gd().GEM_DECORATE_RATIOS[decor.gemMode] ?? 1;
}

function scaleGem(n, ratio) {
  if (!n) return 0;
  return n > 0 ? Math.floor(n * ratio) : Math.ceil(n * ratio);
}

function resolveGemEffectValue(val, mode) {
  if (!Array.isArray(val)) return val;
  const [min, max] = val;
  if (min === max) return min;
  const r = STAT_MODE_RATIOS[mode] ?? 1;
  return Math.round(min + (max - min) * r);
}

function applyGemEffectObject(out, baseStats, eff, mode, ratio) {
  const pick = (v) => scaleGem(resolveGemEffectValue(v, mode), ratio);
  const pct = (base, p) => scaleGem(base * p / 100, ratio);
  if (eff.crit != null) out.crit += pick(eff.crit);
  if (eff.counter != null) out.counter += pick(eff.counter);
  if (eff.hit != null) out.hit += pick(eff.hit);
  if (eff.dodge != null) out.dodge += pick(eff.dodge);
  if (eff.hp != null) out.hp += pick(eff.hp);
  if (eff.mp != null) out.mp += pick(eff.mp);
  if (eff.def != null) out.def += pick(eff.def);
  if (eff.atk != null) out.atk += pick(eff.atk);
  if (eff.agi != null) out.agi += pick(eff.agi);
  if (eff.rec != null) out.rec += pick(eff.rec);
  if (eff.spt != null) out.spt += pick(eff.spt);
  if (eff.atkPct) out.atk += pct(baseStats.atk, eff.atkPct);
  if (eff.defPct) out.def += pct(baseStats.def, eff.defPct);
  if (eff.allPct) {
    for (const k of ['hp', 'mp', 'atk', 'def', 'agi', 'spt', 'rec']) {
      if (baseStats[k]) out[k] += pct(baseStats[k], eff.allPct);
    }
  }
  if (eff.critPct && baseStats.crit) out.crit += pct(baseStats.crit, eff.critPct);
  if (eff.hitPct && baseStats.hit) out.hit += pct(baseStats.hit, eff.hitPct);
  if (eff.amresPct && baseStats.amres) out.amres += pct(baseStats.amres, eff.amresPct);
  if (eff.dodgeMult && baseStats.dodge) {
    out.dodge += Math.floor(baseStats.dodge * (eff.dodgeMult - 1) * ratio);
  }
}

function applyGemBonus(baseStats, decor, slotId) {
  const out = emptyEquipStats();
  if (!decor.gemType || !canGemSlot(slotId)) return out;
  const ratio = getGemRatio(decor);
  const mode = decor.gemMode || 'max';
  if (gd().isQuestGem(decor.gemType)) {
    const q = gd().QUEST_GEMS[decor.gemType];
    const eff = slotId === 'weapon' ? q.weapon : q.armor;
    if (eff) applyGemEffectObject(out, baseStats, eff, mode, ratio);
    return out;
  }
  const eff = (slotId === 'weapon' ? gd().GEM_WEAPON : gd().GEM_ARMOR)[decor.gemType]?.[decor.gemLevel - 1];
  if (!eff) return out;
  applyGemEffectObject(out, baseStats, eff, mode, ratio);
  return out;
}

function resolveEnchantValue(type, level, mode) {
  const range = gd().ENCHANT_RANGES[type]?.[level - 1];
  if (!range) return 0;
  const [min, max] = range;
  if (min === max) return min;
  const ratio = STAT_MODE_RATIOS[mode] ?? 1;
  return Math.round(min + (max - min) * ratio);
}

function applyEnchantBonus(decor, slotId) {
  const out = emptyEquipStats();
  if (!decor.enchantType || !gd().ENCHANT_SLOT_RULES[decor.enchantType]?.includes(slotId)) return out;
  const key = gd().ENCHANT_STAT_KEY[decor.enchantType];
  out[key] = resolveEnchantValue(decor.enchantType, decor.enchantLevel, decor.enchantMode);
  return out;
}

function resolveSlotStats(item, slotId) {
  const { general, mod } = getStatModes();
  const base = resolveEquipStats(item, general, mod, equipCustomStats[slotId]);
  const decor = effectiveDecor(slotId);
  const gem = applyGemBonus(base, decor, slotId);
  const out = { ...base };
  for (const k of Object.keys(out)) out[k] += gem[k] || 0;
  const enchant = applyEnchantBonus(decor, slotId);
  for (const k of Object.keys(out)) out[k] += enchant[k] || 0;
  return out;
}

  const fallback = kind === 'gem' ? '💎' : '✨';
  const label = getDecorBtnLabel(slotId, kind);
  const labelHtml = label ? `<span class="decor-label">${escapeHtml(label)}</span>` : '';
  const inner = url
    ? `<img class="decor-thumb" src="${escapeHtml(url)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${fallback}'))">${labelHtml}`
    : fallback;
  return `<button type="button" class="decor-btn${has ? ' has-img' : ' empty'}" data-slot="${slotId}" data-decor="${kind}" title="${escapeHtml(label || title)}">${inner}</button>`;
}

function buildGemPickerItems() {
  const items = [];
  for (const type of gd().GEM_TYPE_IDS) {
    for (let lv = 1; lv <= 10; lv++) {
      items.push({
        id: `gem|${type}|${lv}`,
        name: gd().GEM_TIER_NAMES(type)[lv - 1],
        category: type,
        level: lv,
        gemType: type,
        gemLevel: lv,
        pickerKind: 'gem',
      });
    }
  }
  for (const qid of gd().QUEST_GEM_IDS) {
    const q = gd().QUEST_GEMS[qid];
    items.push({
      id: `quest|${qid}`,
      name: q.label,
      category: 'quest',
      level: q.level,
      gemType: qid,
      gemLevel: q.level,
      pickerKind: 'gem',
    });
  }
  return items;
}

function buildEnchantPickerItems(slotId) {
  const items = [];
  for (const type of getValidEnchants(slotId)) {
    for (let lv = 1; lv <= 10; lv++) {
      items.push({
        id: `enchant|${type}|${lv}`,
        name: gd().ENCHANT_TYPE_LABELS[type],
        category: type,
        level: lv,
        enchantType: type,
        enchantLevel: lv,
        pickerKind: 'enchant',
      });
    }
  }
  return items;
}

function getGemCategoryLabel(slug) {
  if (slug === 'quest') return '任務寶石';
  return gd().GEM_TYPE_LABELS[slug] || slug;
}

function getEnchantCategoryLabel(slug) {
  return gd().ENCHANT_TYPE_LABELS[slug] || slug;
}

function getDecorPickerCategories() {
  if (pickerMode === 'gem') return [...gd().GEM_TYPE_IDS, 'quest'];
  if (pickerMode === 'enchant') return getValidEnchants(pickerSlot);
  return [];
}

function getDecorPickerItems() {
  if (pickerMode === 'gem') return buildGemPickerItems();
  if (pickerMode === 'enchant') return buildEnchantPickerItems(pickerSlot);
  return [];
}

function formatDecorPickerPreview(item, slotId) {
  if (!item) return '—';
  const { general, mod } = getStatModes();
  const base = equips[slotId]
    ? resolveEquipStats(equips[slotId], general, mod, equipCustomStats[slotId])
    : emptyEquipStats();
  if (item.pickerKind === 'gem') {
    const fakeDecor = { ...effectiveDecor(slotId), gemType: item.gemType, gemLevel: item.gemLevel };
    return formatStatLine(applyGemBonus(base, fakeDecor, slotId));
  }
  const fakeDecor = { ...effectiveDecor(slotId), enchantType: item.enchantType, enchantLevel: item.enchantLevel };
  return formatStatLine(applyEnchantBonus(fakeDecor, slotId));
}

function renderDecorPickerIcon(item) {
  const url = gd().decorPickerImageUrl(item);
  const fallback = item.pickerKind === 'gem' ? '💎' : '✨';
  if (!url) return `<span class="picker-icon placeholder decor-icon">${fallback}</span>`;
  return `<img class="picker-icon" src="${escapeHtml(url)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'picker-icon placeholder decor-icon',textContent:'${fallback}'}))">`;
}

function renderDecorPickerGridItems(items) {
  const sorted = [...items].sort((a, b) => (a.level - b.level) || a.name.localeCompare(b.name, 'zh-Hant'));
  return sorted.map(it => {
    const stats = formatDecorPickerPreview(it, pickerSlot);
    return `<button type="button" class="picker-item decor-pick" data-id="${escapeHtml(it.id)}" title="${escapeHtml(stats)}">
      ${renderDecorPickerIcon(it)}
      <span class="lv">${it.level}</span>
      <span class="name">${escapeHtml(it.name)}</span>
    </button>`;
  }).join('');
}


function applyDecorPick(item) {
  const decor = slotDecorations[pickerSlot];
  if (item.pickerKind === 'gem') {
    decor.gemType = item.gemType;
    decor.gemLevel = item.gemLevel;
  } else {
    decor.enchantType = item.enchantType;
    decor.enchantLevel = item.enchantLevel;
  }
}

function initStatModeSelects() {
  const opts = STAT_MODE_OPTIONS.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
  document.getElementById('statModeGeneral').innerHTML = opts;
  document.getElementById('statModeMod').innerHTML = opts;
  document.getElementById('globalGemDecor').innerHTML = GLOBAL_GEM_OPTIONS.map(o =>
    `<option value="${o.value}">${o.label}</option>`
  ).join('');
  document.getElementById('globalGemDecor').value = globalGemDecor;
  const encOpts = STAT_MODE_OPTIONS.filter(o => o.value !== 'custom').map(o =>
    `<option value="${o.value}">${o.label}</option>`
  ).join('');
  document.getElementById('globalEnchantMode').innerHTML = encOpts;
  document.getElementById('globalEnchantMode').value = globalEnchantMode;
}

function getStatModes() {
  return {
    general: document.getElementById('statModeGeneral').value,
    mod: document.getElementById('statModeMod').value,
  };
}

function itemRelevantKeys(item, group) {
  const keys = group === 'general' ? BASIC_KEYS : MOD_KEYS;
  return keys.filter(k => {
    if (item.ranges?.[k]) return item.ranges[k][0] !== 0 || item.ranges[k][1] !== 0;
    return (item.stats?.[k] ?? 0) !== 0;
  });
}

function resolveStatValue(item, key, mode, customMap) {
  if (mode === 'custom') {
    if (customMap && customMap[key] != null && customMap[key] !== '') {
      return Math.round(Number(customMap[key])) || 0;
    }
    mode = 'max';
  }
  const ratio = STAT_MODE_RATIOS[mode] ?? 1;
  if (item.ranges?.[key]) {
    const [min, max] = item.ranges[key];
    if (min === max) return min;
    return Math.round(min + (max - min) * ratio);
  }
  return item.stats?.[key] ?? 0;
}

function resolveStats(item, generalMode, modMode, customMap) {
  const out = emptyEquipStats();
  if (!item) return out;
  for (const k of BASIC_KEYS) out[k] = resolveStatValue(item, k, generalMode, customMap);
  for (const k of MOD_KEYS) out[k] = resolveStatValue(item, k, modMode, customMap);
  return out;
}

function isHyorikiEnabled() {
  return document.getElementById('hyorikiToggle')?.checked;
}

function isPlayerMadeEquip(item) {
  if (!item) return false;
  if ((item.acquire || '') === '玩家製作') return true;
  return item.categorySlug === 'water-dragon' || WATER_DRAGON_NAMES.has(item.name);
}

function applyHyorikiBonus(stats, item, generalMode) {
  if (!isHyorikiEnabled() || generalMode === 'custom' || !isPlayerMadeEquip(item)) return stats;
  const out = { ...stats };
  for (const k of GENERAL_CORE_KEYS) {
    const val = out[k] || 0;
    if (val) out[k] = Math.floor(val * HYORIKI_RATE);
  }
  return out;
}

function resolveEquipStats(item, generalMode, modMode, customMap) {
  return applyHyorikiBonus(resolveStats(item, generalMode, modMode, customMap), item, generalMode);
}

function initCustomStatsForSlot(slotId, generalMode, modMode) {
  const item = equips[slotId];
  if (!item) {
    delete equipCustomStats[slotId];
    return;
  }
  if (!equipCustomStats[slotId]) equipCustomStats[slotId] = {};
  const keys = [];
  if (generalMode === 'custom') keys.push(...itemRelevantKeys(item, 'general'));
  if (modMode === 'custom') keys.push(...itemRelevantKeys(item, 'mod'));
  for (const k of keys) {
    if (equipCustomStats[slotId][k] == null || equipCustomStats[slotId][k] === '') {
      equipCustomStats[slotId][k] = resolveStatValue(item, k, 'max', null);
    }
  }
}

function renderCustomStatPanel() {
  const panel = document.getElementById('customStatPanel');
  const { general, mod } = getStatModes();
  const needCustom = general === 'custom' || mod === 'custom';
  if (!needCustom) {
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }
  panel.classList.remove('hidden');
  let html = '<p class="hint" style="margin-bottom:8px">自訂模式：手動輸入各欄位裝備數值</p>';
  let hasAny = false;
  for (const slot of SLOTS) {
    const item = equips[slot.id];
    if (!item) continue;
    initCustomStatsForSlot(slot.id, general, mod);
    const keys = [];
    if (general === 'custom') keys.push(...itemRelevantKeys(item, 'general'));
    if (mod === 'custom') keys.push(...itemRelevantKeys(item, 'mod'));
    if (!keys.length) continue;
    hasAny = true;
    html += `<div class="custom-slot-block"><div class="custom-slot-label">${slot.label} · ${escapeHtml(item.name)}</div><div class="custom-stat-grid">`;
    for (const k of keys) {
      const val = equipCustomStats[slot.id][k] ?? '';
      html += `<label>${STAT_LABELS[k]}<input type="number" data-slot="${slot.id}" data-stat="${k}" value="${val}"></label>`;
    }
    html += '</div></div>';
  }
  panel.innerHTML = hasAny ? html : '<p class="hint">請先選擇裝備</p>';
  panel.querySelectorAll('input[data-slot]').forEach(inp => {
    inp.addEventListener('input', () => {
      const sid = inp.dataset.slot;
      const k = inp.dataset.stat;
      if (!equipCustomStats[sid]) equipCustomStats[sid] = {};
      equipCustomStats[sid][k] = inp.value;
      recalc(false);
    });
  });
}

function renderCustomStatPanelIfNeeded() {
  const sig = JSON.stringify({ modes: getStatModes(), equips: SLOTS.map(s => equips[s.id]?.id || null) });
  if (sig === customPanelSignature) return;
  customPanelSignature = sig;
  renderCustomStatPanel();
}

function emptyEquipStats() {
  return Object.fromEntries([...BASIC_KEYS, ...MOD_KEYS].map(k => [k, 0]));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function itemStatValue(item, key) {
  return item?.stats?.[key] ?? 0;
}

function hasExtraMods(item) {
  if (!item) return false;
  if (RESIST_KEYS.some(k => itemStatValue(item, k))) return true;
  const cat = getPickerCategory(item);
  const ignore = new Set(CATEGORY_MOD_IGNORE[cat] || []);
  for (const k of CORRECT_KEYS) {
    if (ignore.has(k)) continue;
    const v = itemStatValue(item, k);
    if (k === 'dodge' && NEG_DODGE_BASELINE_CATS.has(cat) && v <= 0) continue;
    if (v) return true;
  }
  return false;
}

function formatStatLine(stats) {
  return Object.entries(stats)
    .filter(([, v]) => v)
    .map(([k, v]) => `${STAT_LABELS[k] || k}${v > 0 ? '+' : ''}${v}`)
    .join(' · ') || '—';
}

function formatItemStatPreview(item, slotId = null) {
  if (!item) return '';
  const { general, mod } = getStatModes();
  const stats = slotId != null ? resolveSlotStats(item, slotId) : resolveEquipStats(item, general, mod, null);
  const basic = BASIC_KEYS.filter(k => stats[k]).map(k => `${STAT_LABELS[k]}${stats[k] > 0 ? '+' : ''}${stats[k]}`);
  const modLine = MOD_KEYS.filter(k => stats[k]).map(k => `${STAT_LABELS[k]}${stats[k] > 0 ? '+' : ''}${stats[k]}`);
  const detail = [basic.join(' · '), modLine.join(' · ')].filter(Boolean).join(' ｜ ') || '—';
  const variant = getItemVariantBadge(item);
  const name = variant
    ? `${escapeHtml(item.name)} <span class="soul-tag ${variant.cls}">${escapeHtml(variant.label)}</span>`
    : escapeHtml(item.name);
  return `<span class="name">${name}</span>${escapeHtml(detail)}`;
}

function formatPickerStatPreview(item) {
  return formatItemStatPreview(item, null);
}

function setEquipStatPreview(item, slotId) {
  const el = document.getElementById('equipStatPreview');
  if (!item) {
    el.classList.remove('active');
    el.textContent = '游標指向已裝備欄位或寶石／附魔石可預覽效果';
    return;
  }
  el.classList.add('active');
  el.innerHTML = formatItemStatPreview(item, slotId);
}

function setPickerStatPreview(item) {
  const el = document.getElementById('pickerStatPreview');
  if (!item) {
    el.classList.remove('active');
    el.textContent = '—';
    return;
  }
  el.classList.add('active');
  el.innerHTML = formatPickerStatPreview(item);
}

function getNum(id) { return Number(document.getElementById(id).value) || 0; }

const STAT_IDS = ['vit', 'str', 'def', 'agi', 'mag'];

function statRemain(id) {
  const { avail, singleMax } = clampPoints();
  const others = STAT_IDS.filter(x => x !== id).reduce((s, x) => s + getNum(x), 0);
  return { singleMax, remain: Math.max(0, avail - others) };
}

function clearAllStatPoints() {
  STAT_IDS.forEach(id => { document.getElementById(id).value = '0'; });
  recalc();
}

function applyStatShortcut(id, mode) {
  const { singleMax, remain } = statRemain(id);
  let val = 0;
  if (mode === 'max') val = Math.min(singleMax, remain);
  else if (mode === '100') val = Math.min(100, singleMax, remain);
  else if (mode === 'remain') val = Math.min(singleMax, getNum(id) + remain);
  document.getElementById(id).value = String(val);
  recalc();
}

function clampPoints() {
  const lvl = Math.max(1, getNum('level'));
  const avail = 30 + 4 * (lvl - 1);
  const singleMax = Math.floor(avail / 2);
  ['vit','str','def','agi','mag'].forEach(id => {
    const el = document.getElementById(id);
    if (Number(el.value) > singleMax) el.value = String(singleMax);
  });
  return { avail, singleMax };
}

function getEquipTotals() {
  const total = emptyEquipStats();
  for (const slot of SLOTS) {
    const item = equips[slot.id];
    if (!item) continue;
    const s = resolveSlotStats(item, slot.id);
    for (const k of Object.keys(total)) total[k] += s[k] || 0;
  }
  return total;
}

function recalc(refreshCustomPanel = true) {
  const { avail, singleMax } = clampPoints();
  const vit = getNum('vit'), str = getNum('str'), def = getNum('def'), agi = getNum('agi'), mag = getNum('mag');
  const used = vit + str + def + agi + mag;
  document.getElementById('pointsAvail').textContent = avail;
  document.getElementById('pointsUsed').textContent = used;
  document.getElementById('pointsRemain').textContent = Math.max(0, avail - used);
  document.getElementById('singleMax').textContent = singleMax;

  const sum = { ...BASE };
  const add = (p, c) => {
    sum.hp += p * c.hp; sum.mp += p * c.mp; sum.atk += p * c.atk; sum.def += p * c.def;
    sum.agi += p * c.agi; sum.spt += p * c.spt; sum.rec += p * c.rec;
  };
  add(vit, CONTRIB.vit); add(str, CONTRIB.str); add(def, CONTRIB.def);
  add(agi, CONTRIB.agi); add(mag, CONTRIB.mag);

  const eq = getEquipTotals();
  const display = {
    hp: Math.floor(sum.hp + (eq.hp || 0)),
    mp: Math.floor(sum.mp + (eq.mp || 0)),
    atk: Math.floor(sum.atk + (eq.atk || 0)),
    def: Math.floor(sum.def + (eq.def || 0)),
    agi: Math.floor(sum.agi + (eq.agi || 0)),
    spt: Math.floor(sum.spt + (eq.spt || 0)),
    rec: Math.floor(sum.rec + (eq.rec || 0)),
    charm: eq.charm || 0,
    matk: eq.matk || 0,
    amres: eq.amres || 0,
  };

  document.getElementById('basicResults').innerHTML = BASIC_KEYS.map(k =>
    `<div class="result-item"><span>${STAT_LABELS[k]}</span><strong>${display[k]}</strong></div>`
  ).join('');

  document.getElementById('modResults').innerHTML = MOD_KEYS.map(k =>
    `<div class="result-item"><span>${STAT_LABELS[k]}</span><strong>${eq[k] || 0}</strong></div>`
  ).join('');

  renderEquipStage();
  if (refreshCustomPanel) renderCustomStatPanelIfNeeded();
}

function clearAllEquips() {
  SLOTS.forEach(s => { equips[s.id] = null; });
  equipCustomStats = {};
  slotDecorations = Object.fromEntries(SLOTS.map(s => [s.id, {
    gemType: '', gemLevel: 5, enchantType: '', enchantLevel: 5,
  }]));
  customPanelSignature = '';
  recalc();
}

function renderEquipStage() {
  const posClass = { acc1:'tl', hat:'tc', acc2:'tr', weapon:'ml', shield:'mr', body:'bl', shoes:'br' };
  const clusterClass = { top:'cluster-top', left:'cluster-left', right:'cluster-right', bottom:'cluster-bottom' };
  document.getElementById('equipStage').innerHTML = SLOTS.map(s => {
    const item = equips[s.id];
    const pos = posClass[s.id];
    const side = DECOR_SIDE[s.id];
    const img = item && itemImageUrl(item) ? `<img class="equip-thumb" src="${escapeHtml(itemImageUrl(item))}" alt="" loading="lazy">` : '';
    const equipBtn = `<button type="button" class="equip-btn" data-slot="${s.id}">
      <span class="slot-label">${s.label}</span>
      ${img}
      <span class="item-name ${item ? '' : 'empty'}">${item ? formatItemDisplayName(item) : '＋ 選擇'}</span>
    </button>`;
    const decorCol = side
      ? `<div class="decor-col decor-${side}">${renderDecorBtn(s.id, 'gem')}${renderDecorBtn(s.id, 'enchant')}</div>`
      : '';
    const cluster = side
      ? `<div class="slot ${pos} slot-cluster ${clusterClass[side]}">${side === 'left' || side === 'top' ? decorCol + equipBtn : equipBtn + decorCol}</div>`
      : `<div class="slot ${pos}">${equipBtn}</div>`;
    return cluster;
  }).join('');
  document.querySelectorAll('.equip-btn').forEach(btn => {
    const slotId = btn.dataset.slot;
    const item = equips[slotId];
    btn.addEventListener('click', () => openPicker(slotId));
    btn.addEventListener('mouseenter', () => { if (item) setEquipStatPreview(item, slotId); });
    btn.addEventListener('mouseleave', () => setEquipStatPreview(null));
  });
  document.querySelectorAll('.decor-btn').forEach(btn => {
    const slotId = btn.dataset.slot;
    const kind = btn.dataset.decor;
    btn.addEventListener('click', () => openDecorPicker(slotId, kind));
    btn.addEventListener('mouseenter', () => setDecorEffectPreview(slotId, kind));
    btn.addEventListener('mouseleave', () => setEquipStatPreview(null));
  });
}

function itemImageUrl(item) {
  if (!item?.image) return '';
  if (item.image.startsWith('http')) return item.image;
  if (item.image.startsWith('equipment_images/')) return item.image;
  return GUIDE_IMAGE_BASE + item.image;
}

function getOtherAccSlot(slotId) {
  if (slotId === 'acc1') return 'acc2';
  if (slotId === 'acc2') return 'acc1';
  return null;
}

function getAccEquipType(item) {
  return item ? getPickerCategory(item) : null;
}

function getBlockedAccTypes(slotId) {
  const other = getOtherAccSlot(slotId);
  if (!other) return new Set();
  const type = getAccEquipType(equips[other]);
  return type ? new Set([type]) : new Set();
}

function accTypeConflict(slotId, item) {
  if (!item || !getOtherAccSlot(slotId)) return false;
  const blocked = getBlockedAccTypes(slotId);
  return blocked.has(getAccEquipType(item));
}

function getSlotCategories(slotId) {
  const slot = SLOTS.find(s => s.id === slotId);
  const present = new Set(getSlotItems(slotId).map(getPickerCategory));
  const order = SLOT_CATEGORY_ORDER[slot.calcSlots[0]] || [];
  const cats = order.filter(slug => present.has(slug));
  for (const slug of present) if (!cats.includes(slug)) cats.push(slug);
  return cats;
}

function getSlotItems(slotId) {
  const slot = SLOTS.find(s => s.id === slotId);
  let items = catalog.filter(it => slot.calcSlots.includes(it.calcSlot));
  const blocked = getBlockedAccTypes(slotId);
  if (blocked.size) items = items.filter(it => !blocked.has(getPickerCategory(it)));
  return items;
}

function sortPickerItems(items) {
  return [...items].sort((a, b) => {
    const la = a.level ?? 999; const lb = b.level ?? 999;
    if (la !== lb) return la - lb;
    const nameCmp = a.name.localeCompare(b.name, 'zh-Hant');
    if (nameCmp !== 0) return nameCmp;
    const ia = a.itemId ?? 0; const ib = b.itemId ?? 0;
    if (ia !== ib) return ia - ib;
    const idx = pickerSortKey(a); const idy = pickerSortKey(b);
    if (idx != null && idy != null) return idx - idy;
    if (idx != null) return -1;
    if (idy != null) return 1;
    return 0;
  });
}

function getLevelBadge(item, groupItems) {
  const variant = getItemVariantBadge(item);
  if (variant) return variant.label;
  if (!item.level) return '';
  const same = sortPickerItems(groupItems.filter(x => x.level === item.level && x.name === item.name));
  if (same.length <= 1) return String(item.level);
  const idx = same.findIndex(x => x.id === item.id);
  return `${item.level}${String.fromCharCode(65 + Math.max(0, idx))}`;
}

function renderPickerIcon(item, small = false) {
  const img = itemImageUrl(item);
  const cls = small ? 'picker-icon' : 'picker-icon';
  return img
    ? `<img class="${cls}" src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'picker-icon placeholder'}))">`
    : '<span class="picker-icon placeholder"></span>';
}

function bindPickerItems(list) {
  pickerListCache = list;
  document.querySelectorAll('.picker-item').forEach(btn => {
    const item = () => pickerListCache.find(x => x.id === btn.dataset.id)
      || (pickerMode === 'equip' ? catalog.find(x => x.id === btn.dataset.id) : null)
      || null;
    btn.addEventListener('click', () => {
      const picked = item();
      if (!picked) return;
      if (pickerMode === 'equip') {
        if (accTypeConflict(pickerSlot, picked)) return;
        equips[pickerSlot] = catalog.find(x => x.id === picked.id) || picked;
        delete equipCustomStats[pickerSlot];
        customPanelSignature = '';
      } else {
        applyDecorPick(picked);
      }
      closePicker();
      recalc();
    });
    btn.addEventListener('mouseenter', () => {
      if (pickerMode === 'equip') setPickerStatPreview(item());
      else setPickerDecorPreview(item());
    });
    btn.addEventListener('mouseleave', () => setPickerStatPreview(null));
  });
}

function setPickerDecorPreview(item) {
  const el = document.getElementById('pickerStatPreview');
  if (!item) {
    el.classList.remove('active');
    el.textContent = '—';
    return;
  }
  el.classList.add('active');
  el.innerHTML = `<span class="name">${escapeHtml(item.name)}</span>${escapeHtml(formatDecorPickerPreview(item, pickerSlot))}`;
}

function renderPickerGroupedGrid(items, categorySlug) {
  const sortedAll = sortPickerItems(items);
  if (PICKER_FLAT_CATEGORIES.has(categorySlug)) {
    return `<div class="picker-grid">${renderPickerGridItems(sortedAll, { badgeGroup: sortedAll })}</div>`;
  }
  const basic = sortedAll.filter(it => !hasExtraMods(it));
  const extra = sortedAll.filter(it => hasExtraMods(it));
  const showHeaders = basic.length > 0 && extra.length > 0;
  let html = '';
  if (basic.length) {
    if (showHeaders) html += `<h5 class="picker-stat-group-title">${PICKER_STAT_GROUP_LABELS.basic}</h5>`;
    html += `<div class="picker-grid">${renderPickerGridItems(basic, { badgeGroup: sortedAll })}</div>`;
  }
  if (extra.length) {
    if (showHeaders) html += `<h5 class="picker-stat-group-title">${PICKER_STAT_GROUP_LABELS.extra}</h5>`;
    html += `<div class="picker-grid">${renderPickerGridItems(extra, { badgeGroup: sortedAll })}</div>`;
  }
  return html;
}

function renderPickerGridItems(items, { badgeGroup = null } = {}) {
  const sorted = sortPickerItems(items);
  const badgeItems = badgeGroup ? sortPickerItems(badgeGroup) : sorted;
  return sorted.map(it => {
    const { general, mod } = getStatModes();
    const stats = formatStatLine(resolveEquipStats(it, general, mod, null));
    const variant = getItemVariantBadge(it);
    const lv = variant
      ? `<span class="lv soul-tag ${variant.cls}">${escapeHtml(variant.label)}</span>`
      : (getLevelBadge(it, badgeItems) ? `<span class="lv">${getLevelBadge(it, badgeItems)}</span>` : '');
    return `<button type="button" class="picker-item" data-id="${escapeHtml(it.id)}" title="${escapeHtml(stats)}">
      ${renderPickerIcon(it)}
      ${lv}
      <span class="name">${escapeHtml(it.name)}</span>
    </button>`;
  }).join('');
}

function renderPickerSubTabs(categories, activeCat, labelFn) {
  const subTabs = document.getElementById('pickerSubTabs');
  if (!categories.length) {
    subTabs.innerHTML = '';
    subTabs.style.display = 'none';
    return;
  }
  subTabs.style.display = '';
  subTabs.innerHTML = categories.map(slug =>
    `<button type="button" class="picker-sub-tab${slug === activeCat ? ' active' : ''}" data-cat="${escapeHtml(slug)}">${escapeHtml(labelFn(slug))}</button>`
  ).join('');
  subTabs.querySelectorAll('.picker-sub-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      pickerActiveCat = btn.dataset.cat;
      renderPickerList();
    });
  });
}

function openPicker(slotId) {
  pickerMode = 'equip';
  pickerSlot = slotId;
  pickerActiveCat = getSlotCategories(slotId)[0] || null;
  const slot = SLOTS.find(s => s.id === slotId);
  document.getElementById('pickerTitle').textContent = `選擇裝備：${slot.label}`;
  document.getElementById('pickerHint').textContent = '游標指向裝備可查看屬性（依「裝備數值」設定）。';
  document.getElementById('pickerClearBtn').textContent = '清除此欄';
  setPickerStatPreview(null);
  renderPickerList();
  document.getElementById('pickerModal').classList.remove('hidden');
}

function openDecorPicker(slotId, kind) {
  if (!equips[slotId]) {
    alert('請先在此欄位選擇裝備');
    return;
  }
  if (kind === 'gem' && !canGemSlot(slotId)) return;
  if (kind === 'enchant' && !getValidEnchants(slotId).length) return;
  const decor = slotDecorations[slotId];
  if (decor.enchantType && !getValidEnchants(slotId).includes(decor.enchantType)) decor.enchantType = '';
  pickerMode = kind;
  pickerSlot = slotId;
  const slot = SLOTS.find(s => s.id === slotId);
  if (kind === 'gem') {
    pickerActiveCat = decor.gemType
      ? (gd().isQuestGem(decor.gemType) ? 'quest' : decor.gemType)
      : gd().GEM_TYPE_IDS[0];
    document.getElementById('pickerTitle').textContent = `選擇寶石：${slot.label}`;
    document.getElementById('pickerHint').textContent = '左側分類、右側選等級；「寶石」下拉可調鑲嵌效果。';
    document.getElementById('pickerClearBtn').textContent = '清除寶石';
  } else {
    pickerActiveCat = decor.enchantType || getValidEnchants(slotId)[0];
    document.getElementById('pickerTitle').textContent = `選擇附魔石：${slot.label}`;
    document.getElementById('pickerHint').textContent = '左側分類、右側選等級；「附魔石」下拉可調數值模式。';
    document.getElementById('pickerClearBtn').textContent = '清除附魔';
  }
  setPickerStatPreview(null);
  renderPickerList();
  document.getElementById('pickerModal').classList.remove('hidden');
}

function closePicker() {
  document.getElementById('pickerModal').classList.add('hidden');
  pickerSlot = null;
  pickerMode = 'equip';
  pickerActiveCat = null;
  pickerListCache = [];
  setPickerStatPreview(null);
}

function renderPickerList() {
  const grid = document.getElementById('pickerGrid');
  if (pickerMode !== 'equip') {
    const items = getDecorPickerItems();
    if (!items.length) {
      document.getElementById('pickerSubTabs').innerHTML = '';
      grid.innerHTML = '<p class="hint">無可用選項</p>';
      pickerListCache = [];
      return;
    }
    const categories = getDecorPickerCategories();
    const labelFn = pickerMode === 'gem' ? getGemCategoryLabel : getEnchantCategoryLabel;
    if (!pickerActiveCat || !categories.includes(pickerActiveCat)) pickerActiveCat = categories[0];
    renderPickerSubTabs(categories, pickerActiveCat, labelFn);
    const sections = categories.map(slug => {
      const group = items.filter(it => it.category === slug);
      if (!group.length) return '';
      const visible = slug === pickerActiveCat;
      return `<section class="picker-section" data-cat="${escapeHtml(slug)}" style="display:${visible ? 'block' : 'none'}">
        <h4 class="picker-cat-title">${escapeHtml(labelFn(slug))}</h4>
        <div class="picker-grid">${renderDecorPickerGridItems(group)}</div>
      </section>`;
    }).join('');
    grid.innerHTML = sections || '<p class="hint">無可用選項</p>';
    const visibleItems = items.filter(it => it.category === pickerActiveCat);
    bindPickerItems(visibleItems);
    return;
  }

  const slotItems = getSlotItems(pickerSlot);

  if (!slotItems.length) {
    document.getElementById('pickerSubTabs').innerHTML = '';
    grid.innerHTML = '<p class="hint">無符合裝備</p>';
    pickerListCache = [];
    return;
  }

  const categories = getSlotCategories(pickerSlot);
  if (!pickerActiveCat || !categories.includes(pickerActiveCat)) pickerActiveCat = categories[0];
  renderPickerSubTabs(categories, pickerActiveCat, slug => CATEGORY_LABELS[slug] || slug);

  const sections = categories.map(slug => {
    const group = sortPickerItems(slotItems.filter(it => getPickerCategory(it) === slug));
    if (!group.length) return '';
    const visible = slug === pickerActiveCat;
    return `<section class="picker-section" data-cat="${escapeHtml(slug)}" style="display:${visible ? 'block' : 'none'}">
      <h4 class="picker-cat-title">${escapeHtml(CATEGORY_LABELS[slug] || slug)}</h4>
      ${renderPickerGroupedGrid(group, slug)}
    </section>`;
  }).join('');

  grid.innerHTML = sections || '<p class="hint">無符合裝備</p>';
  const visibleItems = sortPickerItems(slotItems.filter(it => getPickerCategory(it) === pickerActiveCat));
  bindPickerItems(visibleItems);
}

function currentBuild() {
  const lvl = Math.max(1, getNum('level'));
  clampPoints();
  recalc();
  const eq = getEquipTotals();
  const vit = getNum('vit'), str = getNum('str'), def = getNum('def'), agi = getNum('agi'), mag = getNum('mag');
  const sum = { ...BASE };
  const add = (p, c) => { sum.hp += p*c.hp; sum.mp += p*c.mp; sum.atk += p*c.atk; sum.def += p*c.def; sum.agi += p*c.agi; sum.spt += p*c.spt; sum.rec += p*c.rec; };
  add(vit, CONTRIB.vit); add(str, CONTRIB.str); add(def, CONTRIB.def); add(agi, CONTRIB.agi); add(mag, CONTRIB.mag);
  for (const k of BASIC_KEYS) sum[k] = Math.floor((sum[k] || 0) + (eq[k] || 0));
  return {
    name: document.getElementById('buildName').value.trim() || '未命名',
    lvl,
    stats: { hp:sum.hp, mp:sum.mp, atk:sum.atk, def:sum.def, agi:sum.agi, spt:sum.spt, rec:sum.rec, matk:eq.matk, amres:eq.amres, crit:eq.crit, counter:eq.counter, hit:eq.hit, dodge:eq.dodge },
  };
}

function renderCompare() {
  const tbody = document.querySelector('#compareTable tbody');
  tbody.innerHTML = compareList.map((b, i) => `<tr>
    <td style="text-align:left">${escapeHtml(b.name)}</td><td>${b.lvl}</td>
    <td>${b.stats.hp}</td><td>${b.stats.mp}</td><td>${b.stats.atk}</td><td>${b.stats.def}</td>
    <td>${b.stats.agi}</td><td>${b.stats.spt}</td><td>${b.stats.rec}</td>
    <td>${b.stats.matk}</td><td>${b.stats.amres}</td><td>${b.stats.crit}</td><td>${b.stats.counter}</td>
    <td>${b.stats.hit}</td><td>${b.stats.dodge}</td>
    <td><button type="button" class="secondary" data-i="${i}">刪除</button></td>
  </tr>`).join('');
  tbody.querySelectorAll('button[data-i]').forEach(btn => {
    btn.addEventListener('click', () => { compareList.splice(Number(btn.dataset.i), 1); renderCompare(); });
  });
}

async function fetchText(url, useProxy = false, timeoutMs = 8000) {
  const prefixes = useProxy ? CORS_PROXIES : [''];
  let lastErr = null;
  for (const prefix of prefixes) {
    try {
      const target = prefix ? prefix + encodeURIComponent(url) : url;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      const resp = await fetch(target, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timer);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.text();
    } catch (e) {
      lastErr = e.name === 'AbortError' ? new Error('載入逾時') : e;
    }
  }
  throw lastErr || new Error('fetch failed');
}

function waitForCatalogScript(timeoutMs = 15000) {
  if (window.EQUIPMENT_CATALOG?.items?.length) return Promise.resolve();
  const scriptEl = document.getElementById('equipCatalogScript');
  if (!scriptEl) return Promise.resolve();
  if (scriptEl.dataset.loaded === '1') return Promise.resolve();
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const timer = setTimeout(finish, timeoutMs);
    scriptEl.addEventListener('load', () => { scriptEl.dataset.loaded = '1'; clearTimeout(timer); finish(); }, { once: true });
    scriptEl.addEventListener('error', () => { clearTimeout(timer); finish(); }, { once: true });
  });
}

function setLoadBarPending(msg) {
  const bar = document.getElementById('loadBar');
  bar.className = 'load-bar';
  bar.textContent = msg;
}

function applyCatalog(data) {
  catalog = data.items || data;
  if (!catalog.length) throw new Error('空資料');
  const bar = document.getElementById('loadBar');
  bar.className = 'load-bar ok';
  bar.textContent = `✅ 裝備圖鑑已就緒：${catalog.length} 件`;
}

async function loadCatalogFromFile(file) {
  applyCatalog(JSON.parse(await file.text()));
  renderEquipStage();
  recalc();
}

function showCatalogLoadError(lastErr) {
  const isFileProtocol = location.protocol === 'file:';
  const bar = document.getElementById('loadBar');
  bar.className = 'load-bar err';
  bar.innerHTML = [
    `⚠️ 無法載入裝備圖鑑：${lastErr?.message || '未知錯誤'}。`,
    isFileProtocol
      ? '直接雙擊開啟時，請確認同目錄有 <code>equipment_catalog.js</code>；或點下方按鈕手動選擇 <code>equipment.json</code>。'
      : '請確認同目錄已上傳 <code>equipment.json</code> / <code>equipment_catalog.js</code>，或執行 <code>scripts/build-equipment-catalog.ps1</code> 更新。',
    '<button type="button" class="secondary" id="pickEquipBtn">📂 選擇 equipment.json</button>',
  ].join('<br>');
  document.getElementById('pickEquipBtn').addEventListener('click', () => {
    document.getElementById('equipFileInput').click();
  });
}

async function loadCatalog() {
  const tryApply = (data, source) => {
    applyCatalog(data);
    console.info('catalog loaded from', source);
  };

  if (window.EQUIPMENT_CATALOG?.items?.length) {
    try { tryApply(window.EQUIPMENT_CATALOG, 'embedded'); return; } catch (e) { console.warn('embedded catalog fail', e); }
  }

  const localJson = new URL('equipment.json', location.href).href;
  try {
    setLoadBarPending('⏳ 載入 equipment.json…');
    tryApply(JSON.parse(await fetchText(localJson, false, 6000)), localJson);
    return;
  } catch (e) {
    console.warn('local json fail', e);
  }

  setLoadBarPending('⏳ 載入 equipment_catalog.js…');
  await waitForCatalogScript(20000);
  if (window.EQUIPMENT_CATALOG?.items?.length) {
    try { tryApply(window.EQUIPMENT_CATALOG, 'equipment_catalog.js'); return; } catch (e) { console.warn('catalog js fail', e); }
  }

  const urls = [REPO_RAW + 'equipment.json'];
  let lastErr = new Error('找不到裝備圖鑑');
  for (const url of urls) {
    try {
      setLoadBarPending('⏳ 載入遠端圖鑑…');
      const useProxy = !url.includes('raw.githubusercontent.com');
      tryApply(JSON.parse(await fetchText(url, useProxy, 10000)), url);
      return;
    } catch (e) {
      lastErr = e;
      console.warn('catalog fail', url, e);
    }
  }
  showCatalogLoadError(lastErr);
}

document.querySelectorAll('#level,#vit,#str,#def,#agi,#mag,#statModeGeneral,#statModeMod,#globalGemDecor,#globalEnchantMode').forEach(el => {
  el.addEventListener('input', () => {
    if (el.id === 'statModeGeneral' || el.id === 'statModeMod') customPanelSignature = '';
    if (el.id === 'globalGemDecor') globalGemDecor = el.value;
    if (el.id === 'globalEnchantMode') globalEnchantMode = el.value;
    recalc();
  });
  el.addEventListener('change', () => {
    if (el.id === 'statModeGeneral' || el.id === 'statModeMod') customPanelSignature = '';
    if (el.id === 'globalGemDecor') globalGemDecor = el.value;
    if (el.id === 'globalEnchantMode') globalEnchantMode = el.value;
    recalc();
  });
});
document.getElementById('hyorikiToggle').addEventListener('change', () => recalc());
document.getElementById('clearAllEquipsBtn').addEventListener('click', clearAllEquips);
document.getElementById('clearAllStatsBtn').addEventListener('click', clearAllStatPoints);
document.querySelectorAll('.stat-shortcut-btn[data-stat]').forEach(btn => {
  btn.addEventListener('click', () => applyStatShortcut(btn.dataset.stat, btn.dataset.mode));
});
document.getElementById('pickerCloseBtn').addEventListener('click', closePicker);
document.getElementById('pickerClearBtn').addEventListener('click', () => {
  if (!pickerSlot) return;
  if (pickerMode === 'gem') {
    slotDecorations[pickerSlot].gemType = '';
  } else if (pickerMode === 'enchant') {
    slotDecorations[pickerSlot].enchantType = '';
  } else {
    equips[pickerSlot] = null;
    delete equipCustomStats[pickerSlot];
    slotDecorations[pickerSlot] = {
      gemType: '', gemLevel: 5, enchantType: '', enchantLevel: 5,
    };
    customPanelSignature = '';
  }
  closePicker();
  recalc();
});
document.getElementById('pickerModal').addEventListener('click', e => { if (e.target.id === 'pickerModal') closePicker(); });
document.getElementById('addBuildBtn').addEventListener('click', () => {
  compareList.push(currentBuild());
  renderCompare();
});
document.getElementById('equipFileInput').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    await loadCatalogFromFile(file);
  } catch (err) {
    showCatalogLoadError(err);
  }
  e.target.value = '';
});

function boot() {
  initStatModeSelects();
  renderEquipStage();
  recalc();
  loadCatalog()
    .then(() => { renderEquipStage(); recalc(); })
    .catch(err => showCatalogLoadError(err));
}

boot();
</script>
